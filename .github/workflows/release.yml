name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-js:
    name: Build JS Bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build JS worker bundles
        run: make docgen-bundle

      - name: Upload JS bundles
        uses: actions/upload-artifact@v4
        with:
          name: js-bundles
          path: pkg/scanner/scripts/dist/
          retention-days: 1

  release:
    name: Release
    needs: build-js
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/goreleaser/goreleaser-cross:v1.24.13
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download JS bundles
        uses: actions/download-artifact@v4
        with:
          name: js-bundles
          path: pkg/scanner/scripts/dist/

      - name: Fix git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  build-catalogs:
    name: Build Catalogs
    needs: release
    uses: ./.github/workflows/build-catalogs.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
